
server.port=8080

# Spring Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/zwinne_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework.web=INFO
logging.level.pl.edu.pbs.zwinnebackend=DEBUG

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# JWT Security Config
# 256-bit key for HMAC-SHA
app.jwt.secret=9a4f2c8d3b7a1e5f8c6b4d2e0f1a3c5e7g9h8i7j6k5l4m3n2o1p0q9r8s7t6u5v
# Access token expiration: 15 minutes (900000 ms)
app.jwt.expiration-ms=900000
# Refresh token expiration: 7 days (604800000 ms)
app.jwt.refresh-expiration-ms=604800000
# Security key to register as a lecturer
app.security.lecturer-key=SecretLecturer123
