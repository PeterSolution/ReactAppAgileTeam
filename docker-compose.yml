version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zwinne_db
    restart: always
    environment:
      POSTGRES_DB: zwinne_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./ZwinneBackEnd
      dockerfile: Dockerfile
    container_name: zwinne_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/zwinne_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    volumes:
      - upload_data:/app/uploads
      - logs_data:/app/logs

  frontend:
    build:
      context: ./ReactAppAgileTeam/ZwinneFrontEnd
      dockerfile: Dockerfile
    container_name: zwinne_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  upload_data:
  logs_data:
